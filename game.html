<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#111;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:30px;
}

.container{
    width:100%;
    max-width:1200px;
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#aaa;
    margin-bottom:30px;
}

.game-box{
    background:#1b1b1b;
    border-radius:12px;
    padding:20px;
}

.search-area{
    position:relative;
}

#guessInput{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

#suggestions{
    position:absolute;
    width:100%;
    background:#222;
    max-height:300px;
    overflow-y:auto;
    border-radius:8px;
    margin-top:4px;
    z-index:100;
}

.suggestion{
    padding:10px;
    cursor:pointer;
}

.suggestion:hover{
    background:#333;
}

.info{
    margin-top:20px;
    text-align:center;
}

#attempts{
    font-size:20px;
    font-weight:bold;
}

.history{
    margin-top:25px;
}

.row{
    display:grid;
    grid-template-columns:
    2fr
    1fr
    1fr
    1fr
    1fr
    1fr;

    gap:6px;
    margin-bottom:8px;
}

.cell{
    padding:12px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}

.header .cell{
    background:#444;
}

.correct{
    background:#16a34a;
}

.wrong{
    background:#b91c1c;
}

.close{
    background:#ca8a04;
}

#message{
    margin-top:20px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

button{
    margin-top:15px;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#e10600;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.hidden{
    display:none;
}

.footer{
    margin-top:25px;
    text-align:center;
    color:#aaa;
}

</style>
</head>

        </div>

        <div class="info">

        <div class="history">

/* =====================================
   VARIÁVEIS
===================================== */

let secretCircuit = null;
let attempts = 5;

/* =====================================
   ELEMENTOS
===================================== */

const input =
document.getElementById("guessInput");

const suggestions =
document.getElementById("suggestions");

const historyRows =
document.getElementById("historyRows");

const attemptsText =
document.getElementById("attempts");

const message =
document.getElementById("message");

const restartBtn =
document.getElementById("restartBtn");

/* =====================================
   INICIAR JOGO
===================================== */

function startGame(){

    attempts = 5;

    attemptsText.textContent =
    attempts;

    historyRows.innerHTML = "";

    message.textContent = "";

    input.disabled = false;

    restartBtn.classList.add(
    "hidden"
    );

    secretCircuit =
    circuits[
        Math.floor(
            Math.random() *
            circuits.length
        )
    ];

}

restartBtn.onclick =
startGame;

/* =====================================
   AUTOCOMPLETE
===================================== */

input.addEventListener(
"input",
()=>{

    const value =
    input.value
    .toLowerCase()
    .trim();

    suggestions.innerHTML = "";

    if(!value) return;

    circuits
    .filter(c =>
        c.name
        .toLowerCase()
        .includes(value)
    )
    .slice(0,10)
    .forEach(c=>{

        const div =
        document.createElement(
        "div"
        );

        div.className =
        "suggestion";

        div.textContent =
        c.name;

        div.onclick = ()=>{

            input.value =
            c.name;

            suggestions.innerHTML=
            "";

        };

        suggestions.appendChild(
        div
        );

    });

});

/* =====================================
   ENTER
===================================== */

input.addEventListener(
"keydown",
e=>{

    if(e.key==="Enter"){

        submitGuess(
        input.value
        );

    }

});

/* =====================================
   CORES
===================================== */

function getClass(
value,
target
){

    if(value === target)
        return "correct";

    return "wrong";
}

/* =====================================
   COMPARAÇÃO NUMÉRICA
===================================== */

function getNumericClass(
value,
target,
margin
){

    if(value===target)
        return "correct";

    if(
        Math.abs(
            value-target
        )<=margin
    ){
        return "close";
    }

    return "wrong";
}

/* =====================================
   TENTATIVA
===================================== */

function submitGuess(
name
){

    if(attempts<=0)
    return;

    const guess =
    circuits.find(
        c =>
        c.name
        .toLowerCase()
        ===
        name
        .toLowerCase()
    );

    if(!guess)
    return;

    suggestions.innerHTML="";
    input.value="";

    const row =
    document.createElement(
    "div"
    );

    row.className="row";

    row.innerHTML=`

        <div class="cell">
            ${guess.name}
        </div>

        <div class="cell ${getClass(
            guess.country,
            secretCircuit.country
        )}">
            ${guess.country}
        </div>

        <div class="cell ${getNumericClass(
            guess.length,
            secretCircuit.length,
            0.5
        )}">
            ${guess.length} km
        </div>

        <div class="cell ${getNumericClass(
            guess.opened,
            secretCircuit.opened,
            10
        )}">
            ${guess.opened}
        </div>

        <div class="cell ${getNumericClass(
            guess.turns,
            secretCircuit.turns,
            2
        )}">
            ${guess.turns}
        </div>

        <div class="cell ${getClass(
            guess.type,
            secretCircuit.type
        )}">
            ${guess.type}
        </div>

    `;

    historyRows.appendChild(
    row
    );

    attempts--;

    attemptsText.textContent=
    attempts;

    if(
        guess.name ===
        secretCircuit.name
    ){

        message.innerHTML=
        "🏆 Você acertou!";

        endGame();

        return;
    }

    if(attempts===0){

        message.innerHTML=
        `
        ❌ Fim de jogo.<br>
        Circuito correto:
        <b>
        ${secretCircuit.name}
        </b>
        `;

        endGame();
    }

}

/* =====================================
   FINALIZAR
===================================== */

function endGame(){

    input.disabled=true;

    restartBtn.classList.remove(
    "hidden"
    );

}

/* =====================================
   MELHORIAS
===================================== */

let previousCircuit = null;

function chooseCircuit(){

    if(circuits.length === 0){
        return null;
    }

    if(circuits.length === 1){
        return circuits[0];
    }

    let selected;

    do{

        selected =
        circuits[
            Math.floor(
                Math.random() *
                circuits.length
            )
        ];

    }while(
        previousCircuit &&
        selected.name === previousCircuit.name
    );

    previousCircuit = selected;

    return selected;
}

/* =====================================
   NOVO START GAME
===================================== */

function startGame(){

    attempts = 5;

    attemptsText.textContent =
    attempts;

    historyRows.innerHTML = "";

    message.innerHTML = "";

    input.value = "";

    input.disabled = false;

    suggestions.innerHTML = "";

    restartBtn.classList.add(
        "hidden"
    );

    secretCircuit =
    chooseCircuit();

    console.log(
        "Circuito sorteado:",
        secretCircuit.name
    );

}

===================================== */

"click",
e=>{

    if(
        e.target !== input

        suggestions.innerHTML = "";
    }

/* =====================================
   FILTRAR CIRCUITOS JÁ TENTADOS
===================================== */

function alreadyGuessed(name){

    const rows =
    [...historyRows.children];

    return rows.some(
        row =>
        row.children[0]
        .textContent
        .trim()
        .toLowerCase()
        ===
        name
        .trim()
        .toLowerCase()
    );

}

    <div class="cell ${getNumericClass(
        guess.turns,
        secretCircuit.turns,
        2
    )}">
        ${guess.turns}
    </div>

    <div class="cell ${getClass(
        guess.type,
        secretCircuit.type
    )}">
        ${guess.type}
    </div>

    `;

    historyRows.prepend(row);

    attempts--;

    attemptsText.textContent =
    attempts;

    if(
        guess.name ===
        secretCircuit.name
    ){

        message.innerHTML =
        `
        🏆 ACERTOU!
        <br><br>
        O circuito era:
        <b>${secretCircuit.name}</b>
        `;

        endGame();

        return;
    }

    if(attempts === 0){

        message.innerHTML =
        `
        ❌ Suas tentativas acabaram.
        <br><br>
        O circuito correto era:
        <br>
        <b>${secretCircuit.name}</b>
        `;

        endGame();
    }

}

/* =====================================
   TECLA ESC
===================================== */

document.addEventListener(
"keydown",
e=>{

    if(
        e.key === "Escape"
    ){
        suggestions.innerHTML="";
    }

});

/* =====================================
   INICIAR
===================================== */

startGame();
</script>
